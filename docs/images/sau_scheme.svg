<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 480" width="1860" height="480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E6FB0"/>
    </marker>
    <style>
      .ln   { fill: none; stroke: #3E6FB0; stroke-width: 2.5; marker-end: url(#arrow); }
      .blk  { fill: #FFFFFF; stroke: #2F5597; stroke-width: 2.5; }
      .sum  { fill: #FFFFFF; stroke: #2F5597; stroke-width: 2.5; }
      .zone { fill: #F3F6FB; stroke: #9AA9C2; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .zt   { font-size: 16px; fill: #5A6B85; font-weight: 600; }
      .zone2 { fill: #E8EEF8; stroke: #9AA9C2; stroke-width: 1.5; stroke-dasharray: 3 4; }
      .frm  { font-size: 24px; fill: #1F2D4D; text-anchor: middle; font-family: Consolas, 'Courier New', monospace; }
      .ttl  { font-size: 22px; fill: #1F2D4D; text-anchor: middle; font-weight: 700; }
      .sub  { font-size: 16px; fill: #1F2D4D; text-anchor: middle; font-family: Consolas, 'Courier New', monospace; }
      .sig  { font-size: 22px; fill: #7030A0; text-anchor: middle; font-family: Consolas, 'Courier New', monospace; }
      .alt  { font-size: 14px; fill: #8A5BB0; text-anchor: middle; font-family: Consolas, 'Courier New', monospace; }
      .fb   { font-size: 22px; fill: #C00000; text-anchor: middle; font-family: Consolas, 'Courier New', monospace; }
      .neg  { font-size: 26px; fill: #1F2D4D; text-anchor: middle; font-weight: 700; }
      .note { font-size: 15px; fill: #7A8699; text-anchor: middle; }
      .lim  { font-size: 17px; fill: #B45309; text-anchor: middle; font-weight: 700; font-family: Consolas, 'Courier New', monospace; }
      .fl   { stroke: #1F2D4D; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1860" height="480" fill="#FFFFFF"/>

  <!-- зоны таймеров -->
  <rect class="zone"  x="48"  y="102" width="824" height="164" rx="10"/>
  <rect class="zone2" x="60"  y="114" width="512" height="138" rx="8"/>
  <rect class="zone"  x="926" y="12"  width="871" height="258" rx="10"/>
  <text class="zt" x="78"  y="243">РС: каждый 2-й вызов · 2,5 кГц</text>
  <text class="zt" x="700" y="256">TIM2 · 5 кГц</text>
  <text class="zt" x="940" y="262">TIM1 · 50 кГц — модель ДПТ</text>

  <!-- фильтр задания -->
  <path class="ln" d="M6,180 H92"/>
  <rect class="blk" x="92" y="135" width="148" height="90" rx="3"/>
  <text class="frm" x="166" y="171">1</text>
  <line class="fl" x1="100" y1="180" x2="232" y2="180"/>
  <text class="frm" x="166" y="208">s·8Tpr + 1</text>
  <text class="note" x="166" y="129">фильтр задания</text>
  <text class="sig" x="46"  y="168">w_ref</text>
  <text class="note" x="46" y="204">из TIM3</text>


  <!-- прямой канал -->
  <path class="ln" d="M240,180 H348"/>
  <path class="ln" d="M392,180 H440"/>
  <path class="ln" d="M560,180 H648"/>
  <path class="ln" d="M692,180 H740"/>
  <path class="ln" d="M860,180 H940"/>
  <path class="ln" d="M1100,180 H1158"/>
  <path class="ln" d="M1202,180 H1250"/>
  <path class="ln" d="M1420,180 H1490"/>
  <path class="ln" d="M1550,180 H1598"/>
  <path class="ln" d="M1642,180 H1680"/>
  <path class="ln" d="M1780,180 H1850"/>

  <!-- обратная связь по ЭДС -->
  <path class="ln" d="M1805,180 V50 H1460"/>
  <path class="ln" d="M1400,50 H1180 V158"/>

  <!-- обратная связь по току -->
  <path class="ln" d="M1455,180 V330 H970"/>
  <path class="ln" d="M890,330 H670 V202"/>

  <!-- обратная связь по скорости -->
  <path class="ln" d="M1805,180 V430 H970"/>
  <path class="ln" d="M890,430 H370 V202"/>

  <!-- момент нагрузки -->
  <path class="ln" d="M1620,310 V202"/>

  <!-- регуляторы -->
  <rect class="blk" x="440" y="148" width="120" height="64" rx="3"/>
  <text class="ttl" x="500" y="175">РС · ПИ</text>
  <text class="sub" x="500" y="199">Kpro_w, Ti_w</text>

  <rect class="blk" x="740" y="148" width="120" height="64" rx="3"/>
  <text class="ttl" x="800" y="175">РТ · ПИ</text>
  <text class="sub" x="800" y="199">Kpro_i, Ti_i</text>

  <!-- преобразователь -->
  <rect class="blk" x="940" y="135" width="160" height="90" rx="3"/>
  <text class="frm" x="1020" y="171">Kpr</text>
  <line class="fl" x1="955" y1="180" x2="1085" y2="180"/>
  <text class="frm" x="1020" y="208">s·Tpr + 1</text>

  <!-- якорная цепь -->
  <rect class="blk" x="1250" y="135" width="170" height="90" rx="3"/>
  <text class="frm" x="1335" y="171">1 / Ryac</text>
  <line class="fl" x1="1262" y1="180" x2="1408" y2="180"/>
  <text class="frm" x="1335" y="208">s·Tyac + 1</text>

  <!-- c (момент) -->
  <rect class="blk" x="1490" y="155" width="60" height="50" rx="3"/>
  <text class="frm" x="1520" y="188">c</text>

  <!-- механика -->
  <rect class="blk" x="1680" y="140" width="100" height="80" rx="3"/>
  <text class="frm" x="1730" y="171">1</text>
  <line class="fl" x1="1692" y1="180" x2="1768" y2="180"/>
  <text class="frm" x="1730" y="208">s·Je</text>

  <!-- c (ЭДС) -->
  <rect class="blk" x="1400" y="25" width="60" height="50" rx="3"/>
  <text class="frm" x="1430" y="58">c</text>

  <!-- датчики -->
  <rect class="blk" x="890" y="305" width="80" height="50" rx="3"/>
  <text class="fb" x="930" y="336">Kot</text>
  <rect class="blk" x="890" y="405" width="80" height="50" rx="3"/>
  <text class="fb" x="930" y="436">Kos</text>

  <!-- сумматоры -->
  <circle class="sum" cx="370"  cy="180" r="22"/>
  <circle class="sum" cx="670"  cy="180" r="22"/>
  <circle class="sum" cx="1180"  cy="180" r="22"/>
  <circle class="sum" cx="1620" cy="180" r="22"/>

  <!-- узлы -->
  <circle cx="1455" cy="180" r="4.5" fill="#3E6FB0"/>
  <circle cx="1805" cy="180" r="4.5" fill="#3E6FB0"/>

  <!-- знаки -->
  <text class="neg" x="352" y="228">−</text>
  <text class="neg" x="652" y="228">−</text>
  <text class="neg" x="1160" y="152">−</text>
  <text class="neg" x="1602" y="228">−</text>

  <!-- сигналы -->
  <text class="sig" x="294"  y="168">w_ref_f</text>
    <text class="sig" x="416"  y="168">dw</text>
  <text class="sig" x="604"  y="168">i_ref</text>
  <text class="sig" x="716"  y="168">di</text>
  <text class="sig" x="898"  y="168">Uyac</text>

  <!-- ограничения -->
  <text class="lim" x="604"  y="206">±I_max</text>
  <text class="lim" x="898"  y="206">±U_max</text>
  <text class="sig" x="1129"  y="168">Epr</text>
  <text class="sig" x="1455" y="168">i_yac</text>
  <text class="sig" x="1574" y="168">M</text>
  <text class="sig" x="1832" y="168">w_dv</text>
  <text class="sig" x="1620" y="332">Mc</text>
  <text class="note" x="1620" y="354">из TIM3 · 50 Гц</text>
  <text class="sig" x="1290" y="40">c·w_dv</text>
  <text class="fb"  x="780"  y="318">Kot·i_yac</text>
  <text class="fb"  x="630"  y="418">Kos·w_dv</text>
</svg>
